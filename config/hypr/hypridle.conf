general {
    lock_cmd = caelestia-system-lock                        # lock via Caelestia shell + 1password (stellarchy remux)
    before_sleep_cmd = caelestia-system-lock                # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = caelestia-system-lock
    on-resume = omarchy-system-wake
}

# Displays turn off ~20s after any lock (handled inside caelestia-system-lock).
# Fallback: unconditional display-off later in the same idle cycle, in case the
# lock-script timer was missed.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = sleep 1 && omarchy-system-wake
}

# Suspend after 10 minutes of idle (matches the old caelestia 600s intent;
# before_sleep_cmd locks first). Remove this block to disable auto-suspend.
listener {
    timeout = 600
    on-timeout = systemctl suspend-then-hibernate
}
