# omartia-dots-remux: mpv — native video resolution
# ──────────────────────────────────────────────
# mpv — media player config
# Lets window size follow the video's native resolution
# ──────────────────────────────────────────────
# How it works:
#   - Hyprland rule floats mpv without a fixed size (see hypr/looknfeel.lua).
#   - mpv then requests its own size based on the video (4K plays at 4K,
#     1080p at 1080p, etc.). Large videos are capped to fit the screen.
#   - Edit this file to tweak that behavior. Comments start with # or ;.
#   - After editing, just reopen mpv — no reload needed. Validate with `mpv --show-profile=builtin`.
#
# Tips:
#   autofit-larger  — max window size as % of screen (90% keeps window inside
#                     screen; smaller videos stay native). Uncomment to adjust.
#   autofit         — min/initial size (rarely needed when autofit-larger is set).
#   geometry        — initial position/size (e.g. "80%x80%+10+10" or "1920x1080").
#                     Leave commented for centered native size.
#   keepaspect-*    — preserve aspect ratio. Keep yes for correct scaling.
#   force-window    — always open a window even for audio-only (yes/immediate).
# Full options: https://mpv.io/manual/stable/  and `man mpv`

# ── Window size — native resolution, capped to screen ──
autofit-larger=90%x90%          # cap large videos to 90% of screen; small videos stay native
keepaspect=yes                  # keep video aspect ratio (yes/no)
keepaspect-window=yes           # keep window aspect in sync with video
# geometry=80%x80%              # uncomment to force a max geometry instead of autofit-larger
# autofit=50%x50%               # uncomment to set a minimum/initial size (rarely needed)

# ── Window behavior ──
force-window=immediate          # always show window (even for audio); "no" = only for video
keep-open=yes                   # keep window open after playback ends (yes/no)
no-border                       # no window decorations (borderless video window)
# fullscreen=no                 # start fullscreen (yes/no). Leave no for native sizing.
# window-scale=1.0              # scale factor for native size (1.0 = 100%). Rarely needed.

# ── Your overrides — add below ──
# Example: lower volume on start, different autofit, etc.
# volume=80
# autofit-larger=80%x80%
